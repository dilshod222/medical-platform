services:
  # ============================================
  # DJANGO BACKEND
  # ============================================
  - type: web
    name: medconnect-demo-api-dilshod222
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend

    buildCommand: bash build.sh

    startCommand: >-
      gunicorn config.wsgi:application
      --bind 0.0.0.0:$PORT
      --workers 1
      --timeout 120

    healthCheckPath: /api/health/

    envVars:
      # Django SECRET_KEY'ni Render o'zi yaratadi
      - key: SECRET_KEY
        generateValue: true

      # Stagingda DEBUG o'chiriladi
      - key: DEBUG
        value: "0"

      # Supabase Session Pooler connection string.
      # Qiymatini Render oynasida o'zimiz kiritamiz.
      - key: DATABASE_URL
        sync: false

      # Django qaysi public host orqali ishlashini biladi
      - key: ALLOWED_HOSTS
        value: medconnect-demo-api-dilshod222.onrender.com

      # React frontend backendga request yuborishi uchun
      - key: CORS_ALLOWED_ORIGINS
        value: https://medconnect-demo-dilshod222.onrender.com

      - key: CSRF_TRUSTED_ORIGINS
        value: https://medconnect-demo-dilshod222.onrender.com

      # Deploy paytida demo ma'lumotlarni yaratamiz
      - key: SEED_STAGING
        value: "1"

      # Demo foydalanuvchilar uchun parol.
      # Render yaratishda parolni o'zimiz kiritamiz.
      - key: STAGING_DEMO_PASSWORD
        sync: false


  # ============================================
  # REACT / VITE FRONTEND
  # ============================================
  - type: web
    name: medconnect-demo-dilshod222
    runtime: static
    rootDir: frontend

    buildCommand: npm ci && npm run build
    staticPublishPath: dist

    envVars:
      - key: VITE_API_BASE_URL
        value: https://medconnect-demo-api-dilshod222.onrender.com/api

    routes:
      # React Router uchun:
      # /login, /dashboard/... kabi URLlar ishlaydi
      - type: rewrite
        source: /*
        destination: /index.html