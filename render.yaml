services:
  # ============================================
  # DJANGO BACKEND
  # ============================================
  - type: web
    name: medconnect-demo-api-dilshod222
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend

    buildCommand: bash build.sh

    startCommand: >-
      gunicorn config.wsgi:application
      --bind 0.0.0.0:$PORT
      --workers 1
      --timeout 120

    healthCheckPath: /api/health/

    envVars:
      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "0"

      - key: DATABASE_URL
        sync: false

      - key: ALLOWED_HOSTS
        value: medconnect-demo-api-dilshod222.onrender.com

      - key: CORS_ALLOWED_ORIGINS
        value: https://medconnect-demo-dilshod222.onrender.com

      - key: CSRF_TRUSTED_ORIGINS
        value: https://medconnect-demo-dilshod222.onrender.com

      # Demo data allaqachon yaratilgan.
      # Har deployda parollar qayta yozilmasligi uchun 0.
      - key: SEED_STAGING
        value: "0"

      - key: STAGING_DEMO_PASSWORD
        sync: false


  # ============================================
  # REACT / VITE FRONTEND
  # ============================================
  - type: web
    name: medconnect-demo-dilshod222
    runtime: static
    rootDir: frontend

    buildCommand: npm ci && npm run build
    staticPublishPath: dist

    envVars:
      - key: VITE_API_BASE_URL
        value: https://medconnect-demo-api-dilshod222.onrender.com/api

    routes:
      - type: rewrite
        source: /*
        destination: /index.html