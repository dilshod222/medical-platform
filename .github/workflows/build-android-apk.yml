name: Build MedConnect Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - staging
    paths:
      - 'android-wrapper/**'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android-wrapper
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp android-wrapper/app/build/outputs/apk/debug/app-debug.apk MedConnect.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MedConnect-APK
          path: MedConnect.apk
          if-no-files-found: error
          retention-days: 14
